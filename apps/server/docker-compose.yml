services:
  postgres:
    image: postgres:16
    container_name: ticketing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
      POSTGRES_DB: ticketing
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - ticketing-postgres-data:/var/lib/postgresql/data

volumes:
  ticketing-postgres-data:
